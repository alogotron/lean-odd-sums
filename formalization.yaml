# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "OddSums"
  description: >-
    Formal verification in Lean 4 (with Mathlib) of the folklore identity
    that the sum of the first n odd natural numbers equals n squared. The
    result is stated as a finite sum over Finset.range n of the terms
    2 * i + 1 and proved by induction.
  authors:
    - "alogotron"
  license: "Apache-2.0"
  responsible_maintainers:
    - "alogotron"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11B25"]

sources:
  - title: "Sum of the first n odd natural numbers equals n squared (folklore identity)"
    type: "folklore"
    relationship: "formalizes"
    note: "Classical identity traditionally illustrated by the Pythagorean gnomon construction; no single bibliographic origin."

related_formalizations: []

status:
  scope: >-
    The single identity sum_{i < n} (2i + 1) = n^2 over the natural numbers
    is formalized completely, with no omitted material. No generalizations
    (e.g. arbitrary arithmetic progressions) are claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Kimi K3"]
      framework: "Agent Zero"
      tool_setup: "AI agent authored the Lean proof under human direction using standard Mathlib tactics (induction, rw, simp, ring)"
      cost:
        wall_time: "approximately 2 hours"
        spend_usd: "not tracked (subscription-based API)"
        hardware: "API-only"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: "Statement and result chosen by the maintainer; the Lean proof and repository scaffolding were produced by an AI agent and are machine-checked by Lean and Comparator in CI."

fidelity:
  divergences: "none known"

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The maintainer audited the formal statement against the informal claim; the proof is machine-checked on every push by the repository CI."

alignment:
  namespace: "OddSums"
  statements:
    - source: "folklore identity"
      lean: "OddSums.main_result"
      module: "Solution"
      status: "proved"
      note: "The Lean statement sums 2 * i + 1 over Finset.range n, which enumerates exactly the first n odd natural numbers."

acknowledgements: "Built from the PalomarRegistry PalomarTemplate; uses Lean 4 and Mathlib from the leanprover-community."
